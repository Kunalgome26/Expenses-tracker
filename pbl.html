<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="pbl2_1.css" />
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            .print-visible, 
            .print-visible *,
            .chart-container, 
            .chart-container * {
                visibility: visible;
            }
            .container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
            }
            .chart-container {
                height: 400px !important;
                margin: 0 auto 30px;
                page-break-after: avoid;
            }
            #list {
                margin-top: 20px;
            }
            .delete-btn,
            .btn.print,
            form,
            .inc-exp-container,
            h3:last-of-type {
                display: none !important;
            }
            h2 {
                text-align: center;
                margin-bottom: 30px;
            }
            h4 {
                margin-bottom: 5px;
            }
            .money {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <h2 class="print-visible">Expense Tracker</h2>
    <div class="container">
        <h4 class="print-visible">Your Balance</h4>
        <h1 id="balance" class="print-visible">$0.00</h1>
        <div class="inc-exp-container print-visible">
            <div>
                <h4>Income</h4>
                <p id="money-plus" class="money money-plus">+$0.00</p>
            </div>
            <div>
                <h4>Expense</h4>
                <p id="money-minus" class="money money-minus">-$0.00</p>
            </div>
        </div>

        <div class="chart-container print-visible">
            <canvas id="chart"></canvas>
        </div>

        <h3 class="print-visible">Transaction History</h3>
        <ul id="list" class="list print-visible"></ul>

        <h3>Add New Transaction</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Text</label>
                <input type="text" id="text" placeholder="Enter Text...." />
            </div>
            <div class="form-control">
                <label for="amount">Amount <br> (negative - expense, positive - income)</label>
                <input type="number" id="amount" placeholder="Enter amount..." />
            </div>
            <button class="btn">Add transaction</button>
        </form>

        <button class="btn print" onclick="window.print()">Print Report</button>
    </div>
    <script src="pbl2_1.js"></script>
</body>
</html>
