<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="pbl.css" />
</head>
<body>
  <body>
    <div class="toggle-container">
  <button id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
</div>

    <div class="container">
      <h2>Expense Tracker</h2>
      <h4>Your Balance</h4>
      <h1 id="balance">$0.00</h1>
      
       <div class="inc-exp-container">
        <div>
          <h4>Income</h4>
          <p id="money-plus" class="money-plus">+$0.00</p>
        </div>
        <div>
          <h4>Expense</h4>
          <p id="money-minus" class="money-minus">-$0.00</p>
        </div>
      </div>
  
      <div class="monthly-summary">
        <h4>This Month's Total Spending</h4>
        <p id="monthly-total" class="money">$0.00</p>
      </div>
  
      <h3>Add new transaction</h3>
      <!-- TOTAL AMOUNT INPUT -->
<div class="input-group">
  <label for="totalAmount">Total Amount (Monthly Budget)</label>
  <input type="number" id="totalAmount" placeholder="Enter total monthly budget" />
  <button onclick="setTotalAmount()">Set Amount</button>
</div>
<div class="input-group">
  <input type="number" id="saving-amount" placeholder="Enter saved amount" />
  <button onclick="addSaving()">Add Saving</button>
</div>

<!-- ADD TRANSACTION FORM -->
<form id="form">
  <div class="input-group">
    <label for="text">Spend amount on</label>
    <input type="text" id="text" placeholder="e.g. Groceries, Snacks, Books" />
  </div>

  <div class="input-group">
    <label for="amount">Amount Spent</label>
    <input type="number" id="amount" placeholder="Enter amount spent" />
  </div>

  <div class="input-group">
    <label for="date">Date</label>
    <input type="date" id="date" />
  </div>

  <button type="submit">Add Transaction</button>
</form>

  
      <h3>History</h3>
      <ul id="list" class="list"></ul>
  
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </div>
  <script src="pbl.js"></script>
</body>
<script>
  document.body.classList.add('light-mode');
</script>
